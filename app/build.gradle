plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.kotlin.android)
    alias(libs.plugins.kotlin.compose)
    alias(libs.plugins.ksp)
}

android {
    namespace 'com.vyora.music'
    compileSdk 36

    defaultConfig {
        applicationId 'com.vyora.music'
        minSdk 29
        targetSdk 35
        versionCode 8
        versionName '1.6.0'

        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    def keystoreProps = new Properties()
    def keystoreFile = file('keystore.properties')
    if (keystoreFile.exists()) keystoreFile.withInputStream { keystoreProps.load(it) }
    def signingValue = { String key, String env -> keystoreProps.getProperty(key) ?: System.getenv(env) }

    signingConfigs {
        release {
            def storePath = signingValue('storeFile', 'VYORA_KEYSTORE')
            if (storePath) {
                storeFile file(storePath)
                storePassword signingValue('storePassword', 'VYORA_KEYSTORE_PASSWORD')
                keyAlias signingValue('keyAlias', 'VYORA_KEY_ALIAS')
                keyPassword signingValue('keyPassword', 'VYORA_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (signingConfigs.release.storeFile != null) signingConfig signingConfigs.release
        }
    }

    buildFeatures {
        compose true
        buildConfig true
    }

    testOptions {
        unitTests.returnDefaultValues = true
        unitTests.includeAndroidResources = true
        unitTests.all {
            systemProperty 'robolectric.pixelCopyRenderMode', 'hardware'
            systemProperty 'shots.only', System.getProperty('shots.only') ?: ''
            systemProperty 'shots.glass', System.getProperty('shots.glass') ?: ''
            systemProperty 'shots.video', System.getProperty('shots.video') ?: ''
            systemProperty 'shots.account', System.getProperty('shots.account') ?: ''
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlin {
        compilerOptions {
            jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17)
        }
    }
}

ksp {
    arg('room.schemaLocation', "$projectDir/schemas")
    arg('room.generateKotlin', 'true')
}

