plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.kotlin.android)
    alias(libs.plugins.kotlin.compose)
    alias(libs.plugins.ksp)
}

android {
    namespace 'com.vyora.music'
    compileSdk 36

    defaultConfig {
        applicationId 'com.vyora.music'
        minSdk 29
        targetSdk 35
        versionCode 6
        versionName '1.4.1'

        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    // Release signing comes from app/keystore.properties (the bundled one is a TEST key for
    // trial builds) or CI environment variables. Without either, the release build is left
    // unsigned instead of failing.
    def keystoreProps = new Properties()
    def keystoreFile = file('keystore.properties')
    if (keystoreFile.exists()) keystoreFile.withInputStream { keystoreProps.load(it) }
    def signingValue = { String key, String env -> keystoreProps.getProperty(key) ?: System.getenv(env) }

    signingConfigs {
        release {
            def storePath = signingValue('storeFile', 'VYORA_KEYSTORE')
            if (storePath) {
                storeFile file(storePath)
                storePassword signingValue('storePassword', 'VYORA_KEYSTORE_PASSWORD')
                keyAlias signingValue('keyAlias', 'VYORA_KEY_ALIAS')
                keyPassword signingValue('keyPassword', 'VYORA_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (signingConfigs.release.storeFile != null) signingConfig signingConfigs.release
        }
    }

    buildFeatures {
        compose true
        buildConfig true
    }

    testOptions {
        // android.util.Log and friends return defaults in JVM unit tests.
        unitTests.returnDefaultValues = true
        unitTests.includeAndroidResources = true
        // Screenshot test: draw with the real (hardware) renderer, which the glass shaders need.
        unitTests.all {
            systemProperty 'robolectric.pixelCopyRenderMode', 'hardware'
            systemProperty 'shots.only', System.getProperty('shots.only') ?: ''
            systemProperty 'shots.glass', System.getProperty('shots.glass') ?: ''
            systemProperty 'shots.video', System.getProperty('shots.video') ?: ''
            systemProperty 'shots.account', System.getProperty('shots.account') ?: ''
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlin {
        compilerOptions {
            jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17)
        }
    }
}

// Room writes every schema version here, so future migrations can be tested against it.
ksp {
    arg('room.schemaLocation', "$projectDir/schemas")
    arg('room.generateKotlin', 'true')
}

dependencies {
    implementation libs.androidx.core.ktx
    implementation libs.androidx.lifecycle.runtime.ktx
    implementation libs.androidx.activity.compose
    implementation libs.androidx.compose.runtime
    implementation libs.androidx.compose.foundation
    implementation libs.androidx.compose.animation
    implementation libs.androidx.ui.util
    implementation libs.androidx.ui
    implementation libs.androidx.ui.graphics
    implementation libs.androidx.ui.tooling.preview
    implementation libs.androidx.material3
    implementation libs.androidx.material.icons.extended
    implementation libs.androidx.navigation.compose

    // Media3 (ExoPlayer)
    implementation libs.androidx.media3.exoplayer
    implementation libs.androidx.media3.session

    // YouTube client
    implementation libs.newpipe.extractor
    implementation libs.okhttp
    implementation libs.coil.compose

    // Library database. DataStore is only read once, to move a 1.x library into Room.
    implementation libs.androidx.room.runtime
    implementation libs.androidx.room.ktx
    ksp libs.androidx.room.compiler
    implementation libs.androidx.datastore.preferences

    testImplementation 'junit:junit:4.13.2'
    // The real org.json; android.jar only ships stubs for JVM tests.
    testImplementation 'org.json:json:20240303'
    // Screenshot checks of real screens on the JVM (Robolectric native graphics).
    testImplementation 'org.robolectric:robolectric:4.17'
    testImplementation "androidx.compose.ui:ui-test-junit4:${libs.versions.compose.get()}"

    testImplementation libs.androidx.room.testing

    debugImplementation libs.androidx.ui.tooling
    debugImplementation libs.androidx.ui.test.manifest
}